<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#E30613">
<title>IBS EXPRESS — Nouveau colis</title>

<!-- Font Awesome uniquement pour les icônes -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{--b:#E30613;--o:#E30613;--k:#111;--g:#F5F5F5;--bd:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--g);color:var(--k);font-family:Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{width:100%;max-width:420px;min-height:100vh;margin:auto;background:#fff}
.header{background:var(--b);color:#fff;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.logo{width:44px;height:44px;border-radius:9px;object-fit:contain;background:#fff}
.brand-name{font-size:21px;font-weight:900}
.brand-sub{font-size:10px;margin-top:3px}
.phone{background:#fff;color:var(--b);width:38px;height:38px;border-radius:10px;font-size:16px;font-weight:900;display:grid;place-items:center}
main{padding-bottom:28px}
.section{padding:18px 16px 0}
.title{font-size:21px;font-weight:900}
.muted,.small{font-size:12px;color:#6B7280;line-height:1.45}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px}
.shadow{box-shadow:0 5px 18px #11111112}
.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.blue{background:var(--b);color:#fff}
.orange{background:var(--o);color:#fff}
.outline{background:#fff;color:var(--b);border:1px solid var(--b)}
.full{width:100%}
.input,.select{width:100%;border:1px solid #D1D5DB;border-radius:12px;padding:13px 14px;background:#fff;outline:none}
.input:focus,.select:focus{border-color:var(--b)}
label{display:block;font-size:12px;font-weight:900;margin:14px 0 6px}

/* Bloc ajouté sans changer le cadrage du dépôt */
.location-title{font-size:12px;font-weight:900;margin:0 0 8px}
.location-choice{border:1px solid var(--bd);border-radius:12px;padding:10px 11px;margin-bottom:8px;display:flex;align-items:flex-start;gap:9px;background:#fff}
.location-choice input{margin-top:2px;accent-color:var(--b)}
.location-choice strong{font-size:12px;display:block}
.location-choice span{font-size:10px;color:#6B7280;display:block;margin-top:2px;line-height:1.35}
.pickup-box{margin:10px 0 2px;padding:12px;border-radius:12px;background:#FFFFFF;border:1px solid #F3B5BA}
.pickup-box.hidden{display:none}
.pickup-box label{margin-top:9px}
.pickup-box label:first-child{margin-top:0}

.footer{background:#111;color:#fff;text-align:center;padding:25px 16px}
.footer-logo{width:58px;height:58px;border-radius:10px;object-fit:contain;background:#fff;display:block;margin:0 auto 8px}.footer strong{font-size:20px}
.footer p{font-size:11px;color:#bbb;margin:7px 0}
.footer-icons{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:13px}
.footer-icons a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#222;color:#fff;font-size:16px}
.footer-icons a:hover{transform:translateY(-2px);filter:brightness(.95)}
.footer-icons a.phone-icon{background:#25D366;color:#fff}
.footer-icons a.whatsapp-icon{background:#25D366;color:#fff}
.footer-icons a.facebook-icon{background:#0A2A8A;color:#fff}
.footer-icons a.email-icon{background:#EA4335;color:#fff}
.footer-icons a.website-icon{background:#E30613;color:#fff}
.footer-icons a.tiktok-icon{background:#000;color:#fff}

@media(min-width:421px){
body{padding:20px 0}
.app{border-radius:20px;overflow:hidden;box-shadow:0 8px 35px #0000001a}
}
</style>
</head>

<script>
const form = document.getElementById('form');
const pickupBox = document.getElementById('pickupBox');
const adresseRamassage = document.getElementById('adresseRamassage');
const quartierRamassage = document.getElementById('quartierRamassage');

document.querySelectorAll('input[name="emplacement"]').forEach(radio => {
  radio.addEventListener('change', () => {
    const pickup = document.querySelector('input[name="emplacement"]:checked').value === 'ramassage';
    pickupBox.classList.toggle('hidden', !pickup);
    adresseRamassage.required = pickup;
    quartierRamassage.required = pickup;
  });
});

function get(){
  try{return JSON.parse(localStorage.getItem('colis') || '[]')}
  catch(e){return []}
}

function make(){
  return 'IBS-' + Math.floor(10000000 + Math.random() * 90000000);
}

form.onsubmit = e => {
  e.preventDefault();

  const emplacement = document.querySelector('input[name="emplacement"]:checked').value;
  const pickup = emplacement === 'ramassage';

  if(pickup && (!adresseRamassage.value.trim() || !quartierRamassage.value)){
    alert('Veuillez renseigner l’adresse exacte et le quartier de ramassage.');
    return;
  }

  let a = get(), c = make();
  while(a.some(x => x.code === c)) c = make();

  const x = {
    code: c,
    nom: document.getElementById('nom').value.trim(),
    telephone: document.getElementById('tel').value.trim(),
    quartier: document.getElementById('quartier').value,
    emplacement: emplacement,
    adresseRamassage: pickup ? adresseRamassage.value.trim() : '',
    quartierRamassage: pickup ? quartierRamassage.value : '',
    statut: pickup ? 'Ramassage à effectuer' : 'Demande enregistrée',
    createdAt: new Date().toISOString()
  };

  a.push(x);
  localStorage.setItem('colis', JSON.stringify(a));
  location.href = 'suivi.html?code=' + encodeURIComponent(c);
};
</script>
